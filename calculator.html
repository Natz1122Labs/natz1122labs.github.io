
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1a">
<title>Smart Calculator | Natz1122Labs</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #080d1a;
  color: white;
  min-height: 100vh;
  padding: 25px 15px;
}

header {
  text-align: center;
  padding: 20px 0 35px;
}

.logo {
  color: #38bdf8;
  font-size: 23px;
  font-weight: bold;
}

header p {
  color: #94a3b8;
  margin-top: 8px;
}

.calculator {
  max-width: 390px;
  margin: auto;
  padding: 22px;
  background: #111c30;
  border: 1px solid #263850;
  border-radius: 18px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #38bdf8;
}

.display {
  background: #080d1a;
  border-radius: 12px;
  padding: 22px 15px;
  margin-bottom: 18px;
  text-align: right;
  overflow: hidden;
}

#result {
  font-size: 36px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

#history {
  color: #94a3b8;
  font-size: 13px;
  min-height: 20px;
  margin-bottom: 8px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  min-height: 62px;
  border: none;
  border-radius: 10px;
  background: #1e293b;
  color: white;
  font-size: 21px;
  cursor: pointer;
}

button:active {
  transform: scale(0.96);
}

.operator {
  background: #075985;
}

.clear {
  background: #9f3030;
}

.equal {
  background: #0284c7;
  grid-column: span 2;
}

.zero {
  grid-column: span 2;
}

footer {
  text-align: center;
  margin-top: 30px;
  color: #64748b;
  font-size: 13px;
}

.back {
  display: inline-block;
  color: #38bdf8;
  text-decoration: none;
  margin-top: 20px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Natz1122Labs</div>
  <p>Building useful digital tools for everyone.</p>
</header>

<main class="calculator">
  <h2>Smart Calculator</h2>

  <div class="display">
    <div id="history"></div>
    <div id="result" aria-live="polite">0</div>
  </div>

  <div class="buttons">
    <button class="clear" onclick="clearAll()">AC</button>
    <button onclick="backspace()">⌫</button>
    <button class="operator" onclick="percent()">%</button>
    <button class="operator" onclick="choose('/')">÷</button>

    <button onclick="number('7')">7</button>
    <button onclick="number('8')">8</button>
    <button onclick="number('9')">9</button>
    <button class="operator" onclick="choose('*')">×</button>

    <button onclick="number('4')">4</button>
    <button onclick="number('5')">5</button>
    <button onclick="number('6')">6</button>
    <button class="operator" onclick="choose('-')">−</button>

    <button onclick="number('1')">1</button>
    <button onclick="number('2')">2</button>
    <button onclick="number('3')">3</button>
    <button class="operator" onclick="choose('+')">+</button>

    <button class="zero" onclick="number('0')">0</button>
    <button onclick="number('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</main>

<footer>
  <p>© 2026 Natz1122Labs. All Rights Reserved.</p>
  <a class="back" href="index.html">← Back to Homepage</a>
</footer>

<script>
let current = '0';
let previous = null;
let operation = null;
let resetNext = false;

const result = document.getElementById('result');
const history = document.getElementById('history');

function update() {
  result.textContent = current;
}

function number(value) {
  if (current === 'Error') clearAll();

  if (resetNext) {
    current = value === '.' ? '0.' : value;
    resetNext = false;
  } else if (value === '.') {
    if (!current.includes('.')) current += '.';
  } else {
    current = current === '0' ? value : current + value;
  }

  update();
}

function choose(op) {
  if (current === 'Error') return;

  if (operation && !resetNext) calculate();

  previous = Number(current);
  operation = op;
  resetNext = true;
  history.textContent = previous + ' ' + op;
}

function calculate() {
  if (operation === null || previous === null) return;

  const a = previous;
  const b = Number(current);
  let answer;

  if (operation === '+') answer = a + b;
  if (operation === '-') answer = a - b;
  if (operation === '*') answer = a * b;

  if (operation === '/') {
    if (b === 0) {
      current = 'Error';
      history.textContent = 'Cannot divide by zero';
      previous = null;
      operation = null;
      resetNext = true;
      update();
      return;
    }
    answer = a / b;
  }

  history.textContent = a + ' ' + operation + ' ' + b + ' =';

  current = String(Number(answer.toPrecision(12)));
  previous = null;
  operation = null;
  resetNext = true;
  update();
}

function percent() {
  if (current === 'Error') return;
  current = String(Number(current) / 100);
  update();
}

function clearAll() {
  current = '0';
  previous = null;
  operation = null;
  resetNext = false;
  history.textContent = '';
  update();
}

function backspace() {
  if (resetNext || current === 'Error') {
    current = '0';
    resetNext = false;
  } else {
    current = current.length > 1 ? current.slice(0, -1) : '0';
  }
  update();
}
</script>

</body>
</html>
