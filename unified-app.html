
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d1a">
<meta name="description" content="Natz1122Labs — Your City in One Glance.">
<link rel="manifest" href="/manifest.json">
<title>Natz1122Labs | Your City in One Glance</title>

<style>
:root {
  color-scheme: dark;
  --bg: #080d1a;
  --panel: #111c30;
  --line: #263850;
  --blue: #38bdf8;
  --muted: #aab8cc;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: #f1f5f9;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 64px;
  padding: 10px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.home-btn {
  border: 1px solid var(--blue);
  background: #10283e;
  color: white;
  padding: 11px 30px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
}

.home-btn:active {
  background: #164568;
}

main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.home-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px 18px;
}

.home-screen h1 {
  font-size: 25px;
  margin: 0 0 10px;
}

.home-screen p {
  color: var(--muted);
  font-size: 14px;
  margin: 0 0 30px;
}

.services {
  width: 100%;
  max-width: 500px;
  display: grid;
  gap: 15px;
}

.service {
  width: 100%;
  min-height: 76px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--panel);
  color: white;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
}

.service:active {
  background: #12334b;
  border-color: var(--blue);
}

.viewer {
  display: none;
  flex: 1;
  min-height: 0;
  position: relative;
}

.viewer.active {
  display: flex;
}

iframe {
  width: 100%;
  height: 100%;
  min-height: 500px;
  border: 0;
  background: var(--bg);
}

.loading {
  position: absolute;
  inset: 0;
  display: none;
  place-items: center;
  background: var(--bg);
  color: var(--muted);
  pointer-events: none;
  z-index: 2;
}

.loading.visible {
  display: grid;
}

nav {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 10px 12px;
  background: #0b1424;
  border-top: 1px solid var(--line);
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}

nav button {
  min-height: 52px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: #e2e8f0;
  border-radius: 12px;
  padding: 10px 4px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}

nav button[aria-pressed="true"] {
  background: #0c3550;
  border-color: var(--blue);
  color: white;
}

@media (min-width: 760px) {
  body {
    max-width: 1100px;
    margin: 0 auto;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  iframe {
    min-height: 600px;
  }
}
</style>
</head>

<body>

<header>
  <button class="home-btn" id="homeButton" type="button">
    ⌂ HOME
  </button>
</header>

<main>

  <section class="home-screen" id="homeScreen">
    <h1>Your City in One Glance</h1>
    <p>News, weather and translation — together in one place.</p>

    <div class="services">
      <button class="service" type="button" data-page="news">
        🌍 Global News
      </button>

      <button class="service" type="button" data-page="weather">
        🌦️ Global Weather
      </button>

      <button class="service" type="button" data-page="translator">
        🗣️ Global Translator
      </button>
    </div>
  </section>

  <section class="viewer" id="viewer">
    <div class="loading" id="loading">
      Loading service...
    </div>

    <iframe
      id="moduleFrame"
      title="Selected service"
      allow="geolocation"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </section>

</main>

<nav aria-label="Main services">
  <button type="button" data-page="news" aria-pressed="false">
    🌍 News
  </button>

  <button type="button" data-page="weather" aria-pressed="false">
    🌦️ Weather
  </button>

  <button type="button" data-page="translator" aria-pressed="false">
    🗣️ Translator
  </button>
</nav>

<script>
(function() {
  'use strict';

  const APP_HOME = '/unified-app.html';

  const homeScreen = document.getElementById('homeScreen');
  const viewer = document.getElementById('viewer');
  const frame = document.getElementById('moduleFrame');
  const loading = document.getElementById('loading');
  const homeButton = document.getElementById('homeButton');

  const buttons = [
    ...document.querySelectorAll('[data-page]')
  ];

  const modules = {
    news: {
      url: '/global-news.html',
      title: 'Global News'
    },

    weather: {
      url: '/global-weather.html',
      title: 'Global Weather'
    },

    translator: {
      url: '/translator.html',
      title: 'Global Translator'
    }
  };

  // Return to the unified app's own home screen.
  function goHome() {

    homeScreen.style.display = 'flex';

    viewer.classList.remove('active');

    loading.classList.remove('visible');

    // Stop and clear the previously opened module.
    frame.src = 'about:blank';

    frame.title = 'Selected service';

    // Clear service selection.
    buttons.forEach(button => {
      button.setAttribute('aria-pressed', 'false');
    });

    // Keep the browser on the unified app.
    history.replaceState(
      null,
      '',
      APP_HOME
    );

    window.scrollTo(0, 0);
  }

  // Open a service inside the unified app.
  function selectModule(key) {

    const item = modules[key];

    if (!item) return;

    homeScreen.style.display = 'none';

    viewer.classList.add('active');

    buttons.forEach(button => {
      button.setAttribute(
        'aria-pressed',
        String(button.dataset.page === key)
      );
    });

    loading.textContent = 'Loading ' + item.title + '...';

    loading.classList.add('visible');

    frame.title = item.title;

    // Load the selected module inside the iframe.
    frame.src = item.url;

    // Update the unified app URL, not the main website.
    history.replaceState(
      null,
      '',
      APP_HOME + '#' + key
    );
  }

  frame.addEventListener('load', function() {
    loading.classList.remove('visible');
  });

  buttons.forEach(button => {

    button.addEventListener('click', function() {
      selectModule(button.dataset.page);
    });

  });

  homeButton.addEventListener('click', function(event) {
    event.preventDefault();
    goHome();
  });

  // Always initialize inside the unified app.
  goHome();

  // Register existing service worker.
  if ('serviceWorker' in navigator) {

    window.addEventListener('load', function() {

      navigator.serviceWorker.register('/sw.js')
        .catch(function(error) {
          console.log('Service worker registration failed:', error);
        });

    });

  }

})();
</script>

</body>
</html>
